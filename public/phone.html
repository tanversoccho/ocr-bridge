<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>OCR Bridge - Phone</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #111;
        color: #fff;
        font-family: sans-serif;
        padding: 16px;
      }
      main {
        max-width: 720px;
        margin: auto;
      }
      h1 {
        font-size: 24px;
      }
      button {
        padding: 12px 18px;
        font-size: 16px;
        margin: 4px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #send {
        background: #83e2a1;
      }
      canvas {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 12px auto;
        touch-action: none;
      }
      [hidden] {
        display: none !important;
      }
      .status,
      p {
        color: #ccc;
        line-height: 1.5;
      }
      label {
        display: block;
        margin: 10px 0;
      }
      input[type="range"] {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Photo OCR</h1>
      <p>Take a photo, crop the text area, then send it to your laptop.</p>
      <input
        id="photo"
        type="file"
        accept="image/*"
        capture="environment"
        hidden
      />
      <button id="take">Take photo / Retake</button>
      <div
        id="editor"
        hidden
      >
        <p>Drag across the photo to select a crop, or adjust the edges below.</p>
        <canvas
          id="crop"
          aria-label="Photo crop selection"
        ></canvas>
        <label
          >Left edge
          <input
            id="left"
            type="range"
            min="0"
            max="99"
            value="0"
        /></label>
        <label
          >Right edge
          <input
            id="right"
            type="range"
            min="1"
            max="100"
            value="100"
        /></label>
        <label
          >Top edge
          <input
            id="top"
            type="range"
            min="0"
            max="99"
            value="0"
        /></label>
        <label
          >Bottom edge
          <input
            id="bottom"
            type="range"
            min="1"
            max="100"
            value="100"
        /></label>
        <button id="reset">Reset crop</button>
        <label>Enhancement filter
          <select id="filter">
            <option value="original">Original (no filter)</option>
            <option value="auto">Auto contrast</option>
            <option value="gray">Grayscale</option>
            <option value="sharp">Light sharpening + contrast</option>
            <option value="bw">Black and white</option>
            <option value="adaptive">Adaptive black and white</option>
            <option value="invert">Invert colors</option>
          </select>
        </label>
        <label>Rotate / straighten
          <select id="rotation">
            <option value="0">0°</option><option value="-12">-12°</option>
            <option value="-6">-6°</option><option value="6">6°</option>
            <option value="12">12°</option><option value="90">90°</option>
            <option value="180">180°</option><option value="270">270°</option>
          </select>
        </label>
        <button id="straighten">Estimate tilt</button>
        <button id="resetEnhance">Reset enhancement</button>
        <button id="stopEnhance" hidden>Stop enhancement</button>
        <p id="enhanceStatus" role="status" aria-live="polite">Original photo selected. Preview before sending.</p>
        <button id="previewButton">Preview enhanced crop</button>
        <canvas
          id="preview"
          aria-label="Cropped photo preview"
          hidden
        ></canvas>
        <button
          id="send"
          disabled
        >
          Send picture
        </button>
      </div>
      <p
        id="status"
        class="status"
        role="status"
        aria-live="polite"
      >
        Connecting to laptop…
      </p>
    </main>
    <script src="/photo-filters.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const photo = $("photo"),
        crop = $("crop"),
        preview = $("preview");
      const ctx = crop.getContext("2d");
      const edges = ["left", "right", "top", "bottom"];
      const source = document.createElement("canvas");
      let ws,
        hasPhoto = false,
        sent = false,
        loading = false,
        anchor = null;
      const say = (text) => {
        $("status").textContent = text;
      };
      let enhanceWorker = null, enhancementBusy = false, enhancementReject = null;
      function updateSend() {
        $("send").disabled =
          !hasPhoto || sent || loading || enhancementBusy || !ws || ws.readyState !== WebSocket.OPEN;
        for (const id of ["take", "reset", "filter", "rotation", "straighten", "previewButton", "resetEnhance", ...edges]) $(id).disabled = enhancementBusy;
        $("stopEnhance").hidden = !enhancementBusy;
      }
      function connectWS() {
        ws = new WebSocket(`${location.protocol === "https:" ? "wss:" : "ws:"}//${location.host}`);
        ws.onopen = () => {
          updateSend();
          say(
            sent
              ? "Reconnected. Check the laptop for the previous result."
              : "Connected. Take a photo or send your crop.",
          );
        };
        ws.onclose = () => {
          updateSend();
          say("Disconnected. Your photo is kept here. Reconnecting…");
          setTimeout(connectWS, 2000);
        };
        ws.onerror = () => say("Connection problem. Check that the laptop server is running.");
      }
      function selection() {
        return Object.fromEntries(edges.map((id) => [id, Number($(id).value) / 100]));
      }
      function draw() {
        if (!hasPhoto) return;
        ctx.drawImage(source, 0, 0, crop.width, crop.height);
        const s = selection();
        const x = s.left * crop.width,
          y = s.top * crop.height;
        const w = (s.right - s.left) * crop.width,
          h = (s.bottom - s.top) * crop.height;
        ctx.fillStyle = "rgba(0,0,0,.6)";
        ctx.fillRect(0, 0, crop.width, crop.height);
        ctx.drawImage(
          source,
          s.left * source.width,
          s.top * source.height,
          (s.right - s.left) * source.width,
          (s.bottom - s.top) * source.height,
          x,
          y,
          w,
          h,
        );
        ctx.strokeStyle = "#83e2a1";
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, w, h);
        preview.hidden = true;
        sent = false;
        updateSend();
      }
      function reset() {
        for (const id of edges) $(id).value = id === "right" || id === "bottom" ? 100 : 0;
        draw();
      }
      $("take").onclick = () => {
        photo.value = "";
        photo.click();
      };
      photo.onchange = async () => {
        const file = photo.files[0];
        if (!file) return;
        if (file.size > 20 * 1024 * 1024) { say("Choose a photo below 20 MB."); return; }
        loading = true;
        updateSend();
        say("Opening photo…");
        const url = URL.createObjectURL(file);
        try {
          const image = new Image();
          image.src = url;
          await image.decode();
          // Retain detail for OCR while limiting phone memory and message size.
          const scale = Math.min(1, 2400 / Math.max(image.naturalWidth, image.naturalHeight));
          source.width = Math.max(1, Math.round(image.naturalWidth * scale));
          source.height = Math.max(1, Math.round(image.naturalHeight * scale));
          source.getContext("2d").drawImage(image, 0, 0, source.width, source.height);
          crop.width = Math.min(900, source.width);
          crop.height = Math.max(1, Math.round((source.height * crop.width) / source.width));
          $("filter").value = "original"; $("rotation").value = "0";
          hasPhoto = true;
          $("editor").hidden = false;
          reset();
          say("Photo ready. Select the text area, preview it, then send.");
        } catch (error) {
          say("Could not open this photo. Try a JPEG or PNG photo.");
        } finally {
          URL.revokeObjectURL(url);
          loading = false;
          updateSend();
        }
      };
      for (const id of edges)
        $(id).oninput = () => {
          if (id === "left") $("left").value = Math.min(+$("left").value, +$("right").value - 1);
          if (id === "right") $("right").value = Math.max(+$("right").value, +$("left").value + 1);
          if (id === "top") $("top").value = Math.min(+$("top").value, +$("bottom").value - 1);
          if (id === "bottom")
            $("bottom").value = Math.max(+$("bottom").value, +$("top").value + 1);
          draw();
        };
      function point(event) {
        const r = crop.getBoundingClientRect();
        return {
          x: Math.max(0, Math.min(100, ((event.clientX - r.left) / r.width) * 100)),
          y: Math.max(0, Math.min(100, ((event.clientY - r.top) / r.height) * 100)),
        };
      }
      crop.onpointerdown = (event) => {
        if (!hasPhoto || loading || enhancementBusy) return;
        anchor = point(event);
        crop.setPointerCapture(event.pointerId);
      };
      crop.onpointermove = (event) => {
        if (!anchor || enhancementBusy) return;
        const p = point(event);
        $("left").value = Math.min(99, Math.floor(Math.min(anchor.x, p.x)));
        $("right").value = Math.min(
          100,
          Math.max(+$("left").value + 1, Math.ceil(Math.max(anchor.x, p.x))),
        );
        $("top").value = Math.min(99, Math.floor(Math.min(anchor.y, p.y)));
        $("bottom").value = Math.min(
          100,
          Math.max(+$("top").value + 1, Math.ceil(Math.max(anchor.y, p.y))),
        );
        draw();
      };
      crop.onpointerup =
        crop.onpointercancel =
        crop.onlostpointercapture =
          () => {
            anchor = null;
          };
      const enhancementStatus = text => { $("enhanceStatus").textContent = text; };
      function rawCrop(straighten = false) {
        const s = selection(), x = Math.floor(s.left * source.width), y = Math.floor(s.top * source.height);
        const w = Math.max(1, Math.round(s.right * source.width) - x), h = Math.max(1, Math.round(s.bottom * source.height) - y);
        const canvas = document.createElement('canvas');
        const limit = $("filter").value === "original" && !straighten ? 2400 : 1800;
        const scale = Math.min(1, limit / Math.max(w, h));
        canvas.width = Math.max(1, Math.round(w * scale)); canvas.height = Math.max(1, Math.round(h * scale));
        const cropContext = canvas.getContext('2d');
        cropContext.fillStyle = '#fff'; cropContext.fillRect(0, 0, canvas.width, canvas.height);
        cropContext.drawImage(source, x, y, w, h, 0, 0, canvas.width, canvas.height);
        return canvas;
      }
      function processPixels(canvas, straighten) {
        const data = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
        const filter = $("filter").value;
        if (filter === 'original' && !straighten) return Promise.resolve({ width: data.width, height: data.height, rgba: data.data.buffer, angle: null });
        if (!window.Worker) return Promise.reject(new Error('Enhancement requires a browser with Web Workers. Select Original to send without a filter.'));
        return new Promise((resolve, reject) => {
          enhancementReject = reject;
          enhanceWorker = new Worker('/photo-enhance-worker.js');
          enhanceWorker.onmessage = event => event.data.error ? reject(new Error(event.data.error)) : resolve(event.data);
          enhanceWorker.onerror = () => reject(new Error('Could not load filters. Refresh the phone page or select Original.'));
          enhanceWorker.postMessage({ rgba: data.data.buffer, width: data.width, height: data.height, filter, straighten }, [data.data.buffer]);
        });
      }
      async function makeCrop(straighten = false) {
        if (!hasPhoto || enhancementBusy) return false;
        enhancementBusy = true; updateSend(); enhancementStatus('Enhancing crop on this phone…');
        try {
          const result = await processPixels(rawCrop(straighten), straighten);
          if (straighten && result.angle !== null) {
            const angle = result.angle;
            let option = [...$("rotation").options].find(item => +item.value === angle);
            if (!option) { option = new Option(angle + '° (estimated)', String(angle)); $("rotation").add(option); }
            $("rotation").value = String(angle);
          }
          const image = document.createElement('canvas'); image.width = result.width; image.height = result.height;
          image.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(result.rgba), result.width, result.height), 0, 0);
          const rad = Number($("rotation").value) * Math.PI / 180, pad = 16;
          preview.width = Math.ceil(Math.abs(image.width * Math.cos(rad)) + Math.abs(image.height * Math.sin(rad))) + pad * 2;
          preview.height = Math.ceil(Math.abs(image.width * Math.sin(rad)) + Math.abs(image.height * Math.cos(rad))) + pad * 2;
          const output = preview.getContext('2d'); output.fillStyle = '#fff'; output.fillRect(0, 0, preview.width, preview.height);
          output.translate(preview.width / 2, preview.height / 2); output.rotate(rad); output.drawImage(image, -image.width / 2, -image.height / 2);
          preview.hidden = false; sent = false;
          enhancementStatus(straighten ? 'Tilt estimated. Check the preview; use rotation to correct it if needed.' : 'Preview ready. This exact enhanced crop will be sent for OCR.');
          return true;
        } catch (error) { enhancementStatus(error.message); return false; }
        finally { enhanceWorker?.terminate(); enhanceWorker = null; enhancementReject = null; enhancementBusy = false; updateSend(); }
      }
      $("stopEnhance").onclick = () => {
        enhanceWorker?.terminate(); enhancementReject?.(new Error('Enhancement stopped. Original photo and crop are kept.'));
      };
      function invalidateEnhancement() { preview.hidden = true; sent = false; updateSend(); enhancementStatus('Settings changed. Preview the crop before sending.'); }
      $("filter").onchange = $("rotation").onchange = invalidateEnhancement;
      $("resetEnhance").onclick = () => { $("filter").value = 'original'; $("rotation").value = '0'; invalidateEnhancement(); };
      $("straighten").onclick = () => makeCrop(true);
      $("reset").onclick = reset;
      $("previewButton").onclick = () => makeCrop(false);
      $("send").onclick = async () => {
        if ($("send").disabled) return;
        try {
          if (preview.hidden && !await makeCrop(false)) return;
          if (!ws || ws.readyState !== WebSocket.OPEN) { say('Disconnected. Reconnect before sending. Your photo is kept.'); return; }
          const base64 = preview.toDataURL('image/jpeg', 0.92).split(',')[1];
          ws.send(JSON.stringify({ type: 'frame', data: base64 }));
          sent = true; updateSend(); say('Enhanced picture sent for OCR. Check the laptop for text.');
        } catch (error) { say('Could not send. Check the connection and try again.'); updateSend(); }
      };
      connectWS();
    </script>
  </body>
</html>
